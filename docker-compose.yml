services:
  loop-planner:
    image: nginx:alpine
    container_name: loop-planner
    restart: unless-stopped
    ports:
      - "8087:80"          # or drop this and put it behind the existing reverse proxy
    volumes:
      # public/ holds only the built index.html (sh build.sh). Mount the DIRECTORY, never the file: git pull replaces
      # index.html by rename, and a file bind mount would keep serving the old inode until the container is recreated.
      - ./public:/usr/share/nginx/html:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - state-api

  # One JSON document shared by every browser on the LAN. Stdlib Python, no image to build:
  # backend/ is bind-mounted read-only and state/ holds state.json. Reached only through nginx (/api/).
  state-api:
    image: python:3.12-alpine
    container_name: loop-planner-state
    restart: unless-stopped
    working_dir: /app
    # runs as your uid so state/state.json is yours, not root's; LP_UID/LP_GID come from .env (defaults 1000).
    # Create the dir first or Docker makes it root-owned:  install -d -o "$(id -u)" -g "$(id -g)" state
    user: "${LP_UID:-1000}:${LP_GID:-1000}"
    command: ["python", "-u", "state_api.py", "--dir", "/state", "--port", "8088"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:ro
      - ./state:/state
    expose:
      - "8088"
