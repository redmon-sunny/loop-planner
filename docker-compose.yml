services:
  loop-planner:
    image: nginx:alpine
    container_name: loop-planner
    restart: unless-stopped
    ports:
      - "8087:80"          # or drop this and put it behind the existing reverse proxy
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - state-api

  # One JSON document shared by every browser on the LAN. Stdlib Python, no image to build:
  # backend/ is bind-mounted read-only and state/ holds state.json. Reached only through nginx (/api/).
  state-api:
    image: python:3.12-alpine
    container_name: loop-planner-state
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "state_api.py", "--dir", "/state", "--port", "8088"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:ro
      - ./state:/state
    expose:
      - "8088"
