server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # data files change on every scan; never let the browser cache them
    location /data/ {
        add_header Cache-Control "no-store";
        autoindex off;
    }
    # raw API cache is for the backend only
    location /data/raw/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
