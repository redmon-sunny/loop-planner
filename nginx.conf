server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # shared state document: the page talks to the state-api container through this prefix
    location /api/ {
        proxy_pass http://state-api:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 8m;
        add_header Cache-Control "no-store";
    }

    # data files change on every scan; never let the browser cache them
    location /data/ {
        add_header Cache-Control "no-store";
        autoindex off;
        try_files $uri =204;    # a data file that no script has written yet is "no content", not an error
    }
    # raw API cache is for the backend only
    location /data/raw/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
